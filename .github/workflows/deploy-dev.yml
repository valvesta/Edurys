# ==========================================================================
# Diegimas į DEV aplinką (Azure).
#
# Paleidžiama automatiškai, kai CI main šakoje baigiasi sėkmingai,
# arba rankiniu būdu (Actions -> Deploy dev -> Run workflow).
# Prisijungimas prie Azure — OIDC (be slaptažodžių). Reikalingi GitHub
# „dev" aplinkos kintamieji, kuriuos išveda infra/azure-dev.sh.
# Kol jų nėra, darbas praleidžiamas.
#
# Eiga: laikina SQL ugniasienės taisyklė -> migracijos -> programos teisės
# (tik app_api) -> pirmasis administratorius -> katalogas (jei dar nėra) ->
# taisyklė pašalinama -> programos diegimas -> patikra /healthz.
# ==========================================================================
name: Deploy dev

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.AZURE_WEBAPP != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    environment: dev
    env:
      DB_SERVER: ${{ vars.AZURE_SQL_SERVER }}.database.windows.net
      DB_NAME: ${{ vars.AZURE_SQL_DB }}
      DB_AUTH: entra
      IMPORTED_BY: github-actions
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with: { node-version: 22 }

      - name: Prisijungimas prie Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Laikina SQL ugniasienės taisyklė šiam diegimui
        run: |
          IP=$(curl -fsS https://api.ipify.org)
          az sql server firewall-rule create -g "${{ vars.AZURE_RG }}" -s "${{ vars.AZURE_SQL_SERVER }}" \
            -n "gh-${{ github.run_id }}" --start-ip-address "$IP" --end-ip-address "$IP" -o none

      - run: npm ci
        working-directory: db

      - name: Migracijos
        working-directory: db
        run: ../.github/scripts/run.sh node tools/migrate.js

      - name: Programos teisės (tik app_api)
        working-directory: db
        run: ../.github/scripts/run.sh node tools/grant-app.js "${{ vars.AZURE_WEBAPP }}"

      - name: Pirmasis globalus administratorius
        working-directory: db
        env:
          BOOTSTRAP_ADMIN_EMAIL: ${{ vars.BOOTSTRAP_ADMIN_EMAIL }}
          BOOTSTRAP_ADMIN_OID: ${{ vars.BOOTSTRAP_ADMIN_OID }}
          BOOTSTRAP_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: ../.github/scripts/run.sh node tools/bootstrap-admin.js

      - name: ERKADO katalogas (importuojamas tik jei dar nėra; su pilna patikra)
        working-directory: db
        run: ../.github/scripts/run.sh node tools/import-catalog.js catalog/erkado-2026-I.bundle.json --publish --if-missing --source ../catalog-sources/erkado/2026-I

      - name: Ugniasienės taisyklė pašalinama
        if: always()
        run: |
          az sql server firewall-rule delete -g "${{ vars.AZURE_RG }}" -s "${{ vars.AZURE_SQL_SERVER }}" \
            -n "gh-${{ github.run_id }}" -o none || true

      - name: Programos paketas
        run: |
          mkdir -p out
          cp -r api web out/
          rm -rf out/api/node_modules out/api/test
          (cd out/api && npm ci --omit=dev --no-audit --no-fund)
          (cd out && zip -qr ../app.zip .)

      - name: Diegimas į App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP }}
          package: app.zip

      - name: Patikra
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://${{ vars.AZURE_WEBAPP }}.azurewebsites.net/healthz"; then echo; exit 0; fi
            sleep 10
          done
          echo "::error::Programa neatsako /healthz"; exit 1
